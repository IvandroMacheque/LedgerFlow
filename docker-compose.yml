services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${PGUSER}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${PGPASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-${PGDATABASE}}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/infra/db/migrations/001_create_wallets_and_ledger.sql:/docker-entrypoint-initdb.d/001_create_wallets_and_ledger.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${PGUSER:-postgres}} -d ${POSTGRES_DB:-${PGDATABASE:-postgres}}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
